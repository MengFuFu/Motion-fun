# ============================================================
# Motion-Guardian 版本目录（Gradle Version Catalog）
#
# 设计原则：
#   1. 所有第三方依赖版本只在这里出现一次，模块内不写死版本号
#   2. "版本组"（agp/kotlin/ksp/hilt）互相有兼容约束，改动前先确认组合
#   3. KSP 版本必须 = <Kotlin版本>-<KSP补丁号>，写错会直接编译失败
# ============================================================
[versions]
# --- 构建工具链（这组互相绑定，改一个要检查其余）---
agp                 = "8.7.3"
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.28"
hilt                = "2.52"
# --- AndroidX 基础 ---
coreKtx             = "1.15.0"
lifecycle           = "2.8.7"
activity            = "1.9.3"
appcompat           = "1.7.0"
material            = "1.12.0"
constraintlayout    = "2.1.4"
fragmentKtx         = "1.8.5"
recyclerview        = "1.3.2"
navigationFragment  = "2.8.3"
navigationUi        = "2.8.3"
# --- 依赖注入 ---
hiltNavigation      = "1.2.0"
# --- 数据与存储 ---
room                = "2.6.1"
datastore           = "1.1.1"
# --- 相机与端侧推理 ---
camerax             = "1.4.1"
mediapipeTasksVision = "0.10.20"
# --- 协程 ---
coroutines          = "1.9.0"
# --- 测试 ---
junit               = "4.13.2"
androidxJunit       = "1.2.1"
espresso            = "3.6.1"
truth               = "1.4.4"

[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx                = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat               = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material                         = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-fragment-ktx            = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-recyclerview            = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-constraintlayout        = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-ktx            = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
androidx-navigation-ui-ktx       = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUi" }

# --- Hilt ---
hilt-android                     = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                    = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation         = { group = "androidx.hilt", name = "hilt-navigation-fragment", version.ref = "hiltNavigation" }

# --- Room ---
androidx-room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx                = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- DataStore ---
androidx-datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- CameraX ---
androidx-camera-core             = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2          = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle        = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view             = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# --- MediaPipe 端侧姿态识别 ---
mediapipe-tasks-vision           = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }

# --- 协程 ---
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- 测试 ---
junit                            = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit                   = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core           = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
truth                            = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }